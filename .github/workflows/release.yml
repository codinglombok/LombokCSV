# Release — publishes each registry on a v* tag after re-running its tests.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag matches every manifest, the changelog and the docs names
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" package.json
          grep -q "^version = \"$v\"" python/pyproject.toml
          grep -q "__version__ = \"$v\"" python/lombokcsv/__init__.py
          grep -q "^## \[$v\]" CHANGELOG.md
          test -f "docs/SPEC_LombokCSV_v${v}.md"
          bash scripts/lombok-doctor.sh LombokCSV

  npm:
    needs: check-version
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and test
        run: |
          python -m pip install --quiet pytest build
          python -m pytest -q
        working-directory: python
      - name: Build distributions
        run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist

  docker:
    # Container image: GHCR always; Docker Hub only when its secrets exist.
    # The Dockerfile entrypoint is a self-verifying smoke test.
    needs: check-version
    environment: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute the image version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
      - name: Detect Docker Hub credentials (secrets are not readable in if:)
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "${DH_USER}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN absent; pushing to GHCR only"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (only when the secrets exist)
        if: steps.dh.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to GHCR (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/codinglombok/lombokcsv:${{ env.VERSION }}
            ghcr.io/codinglombok/lombokcsv:v${{ env.VERSION }}
            ghcr.io/codinglombok/lombokcsv:latest
            ghcr.io/codinglombok/lombokcsv:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push to Docker Hub (only when the secrets exist)
        if: steps.dh.outputs.available == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            docker.io/codinglombok/lombokcsv:${{ env.VERSION }}
            docker.io/codinglombok/lombokcsv:v${{ env.VERSION }}
            docker.io/codinglombok/lombokcsv:latest
            docker.io/codinglombok/lombokcsv:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go-tag:
    # Go modules are versioned with git tags; subdirectory modules need the
    # extra go/v<version> tag. Idempotent: skipped when the tag already exists.
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Push the go/v* module tag (skip when it already exists)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          TAG="go/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists; skipping"
            exit 0
          fi
          git tag -a "${TAG}" -m "LombokCSV Go module v${VERSION} (github.com/codinglombok/lombokcsv/go)"
          git push origin "${TAG}"

  github-release:
    # Creates the GitHub Release with a checksummed source bundle. The bundle
    # is built with git archive, so it contains tracked files only (internal
    # documents stay out, ADR-024).
    needs: [check-version, go-tag]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the public source bundle (tracked files only)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="LombokCSV_${VERSION}/" \
            -o "${RUNNER_TEMP}/LombokCSV_${VERSION}_bundle.zip" HEAD
          cd "${RUNNER_TEMP}"
          sha256sum "LombokCSV_${VERSION}_bundle.zip" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create the GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "LombokCSV ${VERSION}" \
            --generate-notes \
            "${RUNNER_TEMP}/LombokCSV_${VERSION}_bundle.zip" \
            "${RUNNER_TEMP}/SHA256SUMS"
