[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lombokcsv"
version = "1.1.0"
description = "RFC 4180 CSV parser with type detection, safe HTML tables, JSON export and GROUP BY aggregation. Pure Python, zero dependencies. Part of the Lombok Ecosystem."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "codinglombok" }]
requires-python = ">=3.9"
keywords = ["csv", "rfc4180", "parser", "group-by", "type-detection", "zero-dependency", "lombok-ecosystem"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codinglombok/LombokCSV"
Issues = "https://github.com/codinglombok/LombokCSV/issues"

[tool.setuptools]
packages = ["lombokcsv"]

[tool.setuptools.package-data]
lombokcsv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
